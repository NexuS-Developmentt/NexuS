name: Simulation Service

on:
  pull_request:
    paths:
      - "simulation-service/**"
      - ".github/workflows/simulation-service.yml"
  push:
    branches:
      - main
      - "feat/fastapi-simulation-service"
    paths:
      - "simulation-service/**"
      - ".github/workflows/simulation-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulation-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run simulation API tests
        run: pytest -q
