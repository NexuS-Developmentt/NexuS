server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nexus-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus_dev_password}
    hikari:
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.nexus: INFO
